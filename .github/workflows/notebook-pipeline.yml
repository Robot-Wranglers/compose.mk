# See also: https://docs.github.com/en/actions
name: Notebook Pipeline
# On-demand only: run manually from the Actions tab, or when called by another workflow.
on:
  workflow_dispatch: {}
  workflow_call: {}
permissions:
  contents: read
jobs:
  test:
    name: Notebook Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Initialize
        run: make clean init
      # Both twins compose.import the same kernel + jupyter containers, so the
      # first pipeline builds them and the second reuses the docker cache.
      - name: Run Notebook Pipeline (plain make)
        run: ./demos/notebooking.mk tux.require lab.pipeline
        env:
          COLUMNS: 150
      - name: Run Notebook Pipeline (CMK-lang twin)
        run: ./demos/cmk/notebooking.cmk tux.require lab.pipeline
        env:
          COLUMNS: 150
      # https://til.simonwillison.net/github-actions/debug-tmate
      # - name: tmate debugging session if tests fail
      #   if: failure() && github.event_name == 'workflow_dispatch'
      #   uses: mxschmitt/action-tmate@v3