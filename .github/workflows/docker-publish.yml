# See also: https://docs.github.com/en/actions
# Builds the via/docker shim image and publishes it (multi-arch) to GHCR.
name: Publish Docker Image
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch: {}
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
    paths: [ 'compose.mk', 'via/docker/**', '.github/workflows/docker-publish.yml' ]
permissions:
  contents: read
  packages: write
jobs:
  publish:
    name: Build + push (ghcr.io)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # :latest on default branch, :vX.Y.Z + :X.Y on tags, plus a :sha tag.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build + push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          # Same context the public `docker build <repo>#<ref>:via/docker` uses.
          context: ./via/docker
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Fetch compose.mk at THIS commit (immutable -> exact + cacheable). The
          # published image equals `docker build <repo>#<sha>:via/docker`.
          build-args: |
            CMK_REPO=${{ github.repository }}
            CMK_REF=${{ github.sha }}
