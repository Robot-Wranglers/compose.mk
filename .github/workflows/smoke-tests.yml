# See also: https://docs.github.com/en/actions
# The smoke pytest suite (via tox): wraps tests/scripts/*.sh and asserts clean
# exit. Needs a docker daemon (ubuntu-latest provides it). This suite had no
# action before; kept ON-DEMAND only (workflow_dispatch / workflow_call) to
# avoid adding per-PR docker load -- flip on push/pull_request to auto-run it.
name: Smoke Tests
on:
  workflow_dispatch: {}
  workflow_call: {}
permissions:
  contents: read
jobs:
  smoke:
    name: Smoke (pytest via tox)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Initialize
        run: make clean init
      - name: Run smoke-tests
        run: make smoke-test
