# See also: https://docs.github.com/en/actions
# The docker.* + integration suites (pytest via tox). Need a docker daemon,
# which ubuntu-latest provides. Kept separate from the fast unit-tests workflow.
# Network builds (docker.from.url/github) stay off unless CMK_TEST_NETWORK=1.
name: Docker Tests
on:
  workflow_dispatch: {}
  workflow_call: {}
  push:
    branches: [ "main" ]
    paths-ignore: ['**.gif', '**.md', '**.md.j2', '**.mmd', '**.png', '**.svg']
  pull_request:
    branches: [ "main" ]
    paths-ignore: ['**.gif', '**.md', '**.md.j2', '**.mmd', '**.png', '**.svg']
permissions:
  contents: read
jobs:
  docker:
    name: docker.* suite (pytest via tox)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Docker tests
        run: make docker-test
      - name: Integration tests
        run: make integration-test
