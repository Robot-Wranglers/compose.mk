# See also: https://docs.github.com/en/actions
# The integration pytest suite (via tox): scaffolds mini-projects + runs CMK
# demos end-to-end. Needs a docker daemon (ubuntu-latest provides it) and
# builds images, so it's slower. One pytest suite per workflow; runnable on
# demand. Network builds stay off unless CMK_TEST_NETWORK=1.
name: Integration Tests
on:
  workflow_dispatch: {}
  workflow_call: {}
  push:
    branches: [ "main", "[0-9]+.[0-9]+" ]
    paths-ignore: ['**.gif', '**.md', '**.md.j2', '**.mmd', '**.png', '**.svg']
  pull_request:
    branches: [ "main", "[0-9]+.[0-9]+" ]
    paths-ignore: ['**.gif', '**.md', '**.md.j2', '**.mmd', '**.png', '**.svg']
permissions:
  contents: read
jobs:
  integration:
    name: Integration (pytest via tox)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install socat
        # demos/cmk/jqd.cmk gates demo.socket behind assert.tool.required/socat.
        run: sudo apt-get update && sudo apt-get install -y socat
      - name: Initialize
        run: make clean init
      - name: Run integration-tests
        run: make integration-test
