# Verifies every packaging path that puts compose.mk on PATH (tests/tox.ini installer envs).

# Opt-in only: it installs packages and builds images, and what it covers changes only when a shim under via/ changes.
name: Installers Tests
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch: {}
  workflow_call: {}
permissions:
  contents: read
jobs:
  installers:
    name: Installers (pip, npm, basher, docker shims via tox)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Initialize
        run: make clean init
      - name: Run installers-test
        run: make installers-test
