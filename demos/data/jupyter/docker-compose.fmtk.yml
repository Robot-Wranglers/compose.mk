# default to line-nos: https://github.com/jupyterlab/jupyterlab/issues/2395
# docker images https://github.com/Z3Prover/z3/discussions/5740
# https://github.com/z3prover/z3/pkgs/container/z3
# docker pull ghcr.io/z3prover/z3:ubuntu-20.04-bare-z3-sha-d66609e
name: notebooking 
services:
  
  # Only used for inheritance, this collects common config.
  abstract: &abstract
    image: hello-world
    stdin_open: false
    tty: false
    environment:
      DOCKER_HOST_WORKSPACE: ${DOCKER_HOST_WORKSPACE:-${PWD}}
      CMK_DIND: "1"
      workspace: /lab
    working_dir: /lab
    volumes:
      - ${DOCKER_HOST_WORKSPACE:-${PWD}}:/lab
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock

  # https://github.com/Z3Prover/z3/discussions/5740
  # z3 official container does not include bindings
  z3: &z3
    <<: *abstract
    hostname: z3
    image: compose.mk:z3
    build:
      context: .
      dockerfile_inline: |
        FROM ghcr.io/z3prover/z3:ubuntu-20.04-bare-z3-sha-d66609e
        RUN apt-get update -qq && apt-get install -qq -y python3 python3-pip
        RUN pip3 install z3-solver==4.14.0.0 -q
    
  z3_py:
    <<: *z3
    depends_on: ['z3']
    hostname: z3_py
    image: compose.mk:z3_py
    entrypoint: python

  # no official container for alloy-lang, 
  # but this one can run headless and return JSON
  alloy:
    <<: *abstract
    hostname: alloy
    image: compose.mk:alloy 
    build:
      context: .
      dockerfile_inline: |
        FROM eloengineering/alloy-cli:4.2
        RUN apt-get update && apt-get install -y make g++ openjdk-17-jdk-headless 
    entrypoint: alloy-run
    command: /dev/stdin
  
  # A self-contained lean4 container, along the lines of the standalone
  # `demos/lean.mk` demo (which also ships mathlib).  Here the notebooks only
  # exercise core Lean4, so we keep the image small and skip mathlib.
  lean4: &lean4
    <<: *abstract
    hostname: lean4 
    image: compose.mk:lean4
    entrypoint: lean
    build:
      context: .
      dockerfile_inline: |
        FROM debian:bookworm-slim
        SHELL ["/bin/bash", "-x", "-c"]
        RUN apt-get update -qq && apt-get install -qq -y curl
        RUN curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
          > /usr/local/bin/elan-init.sh
        # Pin the toolchain (matches demos/lean.mk) so image size is frozen
        # against upstream growth.  The demo notebooks only need core Lean4,
        # so we skip the (~10gb) mathlib build entirely.
        RUN bash /usr/local/bin/elan-init.sh -y \
          --default-toolchain leanprover/lean4:v4.17.0
        RUN cp /root/.elan/bin/lean /root/.elan/bin/lake /usr/local/bin
        ENV PATH="$PATH:/root/.elan/bin/"
        RUN lean --version
  
  lean4_script:
    <<: *lean4
    depends_on: ['lean4']
    hostname: lean4_script
    image: compose.mk:lean4.script
    entrypoint: ['lean','--run']
