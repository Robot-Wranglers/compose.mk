[pytest]
testpaths = .
addopts = -ra --strict-markers --strict-config -v
markers =
    unit: SUITE (capability) -- pure target I/O runnable with no docker/modules and no demo pass-fail run
    plugin: the .cmk/ plugin suite -- plugins import cleanly + expose their public surface
    external_module: behavioral suite for an external .cmk module (one that owns a namespace) -- exercises runtime behavior, not just import (cf. the import-level `plugin` suite)
    external_plugin: behavioral suite for an external .cmk plugin (one that injects into existing namespaces) -- exercises runtime behavior
    smoke: wraps the legacy tests/scripts/*.sh shell scripts
    docker: the docker.* target suite
    integration: scaffolds a project dir
    compiler: TOPIC (subject) -- tests about the CMK->Makefile transpile/lowering (assert on .compiled/golden); cross-cuts suites, co-exists with a suite marker
    docstring: TOPIC (subject) -- tests about docstrings / __doc__ / moduledoc lowering + reification; cross-cuts suites, co-exists with a suite marker
    self: TOPIC -- self.* desugar / self-attr / self-target idiom
    banana: TOPIC -- banana bracket forms + operator algebra (+ | %)
    namespace: TOPIC -- namespace/nested-namespace handling + qualification
    module: TOPIC -- cmk module kind, __main__, members, external modules
    vm: TOPIC -- the CMK virtual machine (control stack, coroutines, steer, reflective)
    machine: TOPIC -- container/compose machine kinds + hierarchy
    protocol: TOPIC -- cmk.protocol / structural conformance / Documented
    classvar: TOPIC -- classvars= / class-level vs instance-var semantics
    class_system: TOPIC -- class body/scope, copy, inheritance, dot-operator, dispatch
    callform: TOPIC -- callform lowering (cmk.NAME(args) -> $(call ..)) + anchors
    receiver: TOPIC -- receivers / smart-receiver dispatch
    import: TOPIC -- import/include directives + import.target/def
    sandbox: TOPIC -- the __sandbox__ lab-bench compiler harness
    hosted: TOPIC -- the __hosted__ partition + hosted cache
    channel: TOPIC -- channel ops / channel class
    code_object: TOPIC -- code-object argv/composition/mobility/parity/template
    dsl: TOPIC -- dsl kinds (jqlang/awklang/python/golang/rust) + machine-backing
    jqlang: TOPIC -- the jqlang dsl + its docstrings/gitops usage
    awklang: TOPIC -- the awklang dsl + hosted awk exports
    polyglot: TOPIC -- polyglot code kinds (golang/rust) build/cache/run
    repl: TOPIC -- the cmk repl (mode/debugger/wrapper/signoff)
    m5: TOPIC -- the m5.* primitive family + m5.table/mtable
    ambient: TOPIC -- ambient (*[| .. |]) declarations / ambient calculus
    pragma: TOPIC -- cmk pragmas (boot/stacking/run-mode)
    bootloader: TOPIC -- the bootloader / pragma-boot path
    stack: TOPIC -- call-stack + io.stack ops
    overlay: TOPIC -- overlay mechanism
    completion: TOPIC -- shell tab-completion
    reflection: TOPIC -- reflective compilation/imports + vm reflection
    lambda: TOPIC -- lambda forms (banana + multiline)
    kwargs: TOPIC -- kwarg parsing/lowering (multikwarg, paren)
    ctor: TOPIC -- constructors / __new__ / instance construction memory
    iface: TOPIC -- ifaces= / interface mixins
    fault: TOPIC -- fault system / errno / mk.error
    flux: TOPIC -- flux.* control-flow helpers
    metaprogramming: TOPIC -- metaprogramming.cmk exemplar surface
    cmklang: TOPIC -- cmk-lang front-end grammar/lowering
    supervisor: TOPIC -- supervisor / signals / run-scoped guards
    cook: TOPIC -- cook/cooked banana bodies + cook-gated passes
    goals: TOPIC -- goal-solving / backtracking / queens (Icon-style search)
    trampoline: TOPIC -- the supervisor trampoline / beam rewrite
    hooks: TOPIC -- flux/reflection hooks + hook-probe fast-skip
    glob: TOPIC -- intermediate glob + memory scaling
    logging: TOPIC -- loggable protocol / log channels / log ceremony
    capture: TOPIC -- recipe capture (indent invariance, multiline, capture-arrow)
    tools: TOPIC -- the tools.* module (jq/yq/jb/glow) + tool proxy/memoize
    streams: TOPIC -- stream.* helpers
    entrypoint: TOPIC -- __main__ / entrypoint protocol / module-main callable
    dockerfile: TOPIC -- the Dockerfile kind + inline dockerfile build
    compose: TOPIC -- docker-compose machinery / ComposeFile / compose-service
    seed: TOPIC -- lang.seed / grow! / seed templates
    feed: TOPIC -- machine feed/flag discipline
    needs_docker: requires a reachable docker daemon (auto-skipped without one)
    network: requires network egress (skipped unless CMK_TEST_NETWORK=1)
    nushell: uses the heavy nushell container (skipped unless CMK_TEST_NUSHELL=1)
    tui: headless embedded-TUI suite; builds + runs the heavy compose.mk:tux container (skipped unless CMK_TEST_TUI=1)
    perf: cold-start performance benchmark (report-only; opt-in, not a PR gate -- on-demand workflow)
    notebooking: heavy jupyter-lab pipeline for the notebooking .mk + .cmk twins; builds ~7GB of kernel containers (skipped unless CMK_TEST_NOTEBOOKING=1)
    covers_demo: covers_demo("a.cmk", ..): declares this test exercises those demos/cmk/*.cmk files, excluding them from the demo-run sweep (test_demos_cmk_lang.py)
