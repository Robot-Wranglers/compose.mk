# tox config for the compose.mk test-suite. tox_root is this `tests/` dir, so
# invoke from the repo root with:  tox -c tests/tox.ini -e unit
[tox]
envlist = unit
skipsdist = True

[testenv]
skip_install = True
# Tests shell out to ./compose.mk, which needs system tools (make, bash, jq,
# awk, and docker for the later layers) found via the inherited environment.
deps = -r{tox_root}/requirements-test.txt
changedir = {tox_root}
passenv =
    HOME
    PATH
    TERM
    USER
    LOGNAME
    SHELL
    LANG
    LC_ALL
    COLUMNS
    COLORTERM
    TMPDIR
    DOCKER_HOST
    DOCKER_*
    CMK_TEST_*
setenv =
    NO_COLOR = 1

[testenv:normalize]
description = Style + lint checks (ruff: 2-space indent, 79-col lines)
commands =
    ruff format --check .
    ruff check .

[testenv:fix]
description = Auto-apply ruff formatting + lint fixes
commands =
    ruff format .
    ruff check --fix .

[testenv:unit]
description = Fast, no-docker unit tests (stream.* and friends)
commands = pytest -m unit {posargs:.}

[testenv:smoke]
description = Smoke tests — run tests/scripts/*.sh, assert clean exit
commands = pytest -m smoke {posargs:.}

[testenv:docker]
description = docker.* target suite (needs a daemon; cleanup is label-scoped)
commands = pytest -m docker {posargs:.}

[testenv:coverage]
description = Target-level coverage report (direct, report-only)
# One pytest session across the suites so the recorder accumulates; the report
# is gated on CMK_TEST_COVERAGE and never fails the run. Smoke is excluded: its
# scripts add no targets beyond what the other suites already exercise, and it's
# slow -- so it's not worth its runtime in the coverage pass.
setenv =
    NO_COLOR = 1
    CMK_TEST_COVERAGE = 1
    # Canonical full run -> a single `coverage.md` (ad-hoc runs are per-suite).
    CMK_COVERAGE_LABEL = coverage
commands = pytest -m "unit or docker or integration or compiler" {posargs:.}

[testenv:integration]
description = Integration tests (require a docker daemon)
commands = pytest -m integration {posargs:.}

[testenv:compiler]
description = CMK compiler/transpiler tests (no docker)
commands = pytest -m compiler {posargs:.}

[testenv:perf-test]
description =
    Cold-start performance benchmark (report-only; opt-in, NOT wired to CI).
    10 cold-start samples each of `flux.ok`, a CMK compile (transpile), and a
    CMK compile+interpret; prints min/median/mean/max. `-s` so the [perf]
    summary lines are shown. No docker. Override count with CMK_PERF_SAMPLES.
commands = pytest -m perf -s {posargs:.}

[testenv:npm-installer]
description =
    Build+install with the npm packaging shim; verify a global on-PATH
    `compose.mk` (tool mode + global-mode CMK interpret). npm is exercised
    INSIDE a node:* container, so npm is never assumed present on the host --
    only docker is. The container also gets compose.mk's runtime deps: make +
    jq and gawk (the compiler's awk stages need GNU awk, not mawk/busybox awk;
    no procps/`ps` -- the supervisor self-detects MAKE_CLI from /proc on Linux).
    The package is copied with `cp -rL` into a writable dir first: that
    dereferences the `compose.mk` symlink into a real file (npm would otherwise
    `chmod` through it onto the read-only /work mount -> EROFS), exactly the way
    pip's build resolves the symlink for the pip-installer env.
skip_install = true
deps =
allowlist_externals = docker
commands =
    docker run --rm -e NO_COLOR=1 -v {tox_root}/..:/work:ro node:20-bookworm-slim sh -c 'apt-get update -qq >/dev/null 2>&1 && apt-get install -y -qq make jq gawk >/dev/null 2>&1 && mkdir -p /pkg && cp -rL /work/via/npm/. /pkg/ && cd /pkg && npm install -g . >/dev/null 2>&1 && compose.mk flux.ok && echo abc | compose.mk stream.echo | grep -qx abc && d=$(mktemp -d) && printf "a:\n\tprintf one\n__main__:\n\tthis.a\n" > "$d/x.cmk" && cd "$d" && CMK_SUPERVISOR=1 compose.mk mk.interpret! x.cmk | grep -q one'

[testenv:basher-installer]
description =
    Verify compose.mk installs onto PATH via basher (https://github.com/basherpm/basher),
    which needs NO packaging shim -- it links the repo-root executable directly.
    Exercised entirely INSIDE a debian container (basher cloned from git +
    compose.mk's runtime deps: make jq gawk; no procps -- the supervisor
    self-detects MAKE_CLI from /proc on Linux), so neither basher nor the
    host is assumed to have anything but docker. basher can only `install` from a
    git remote, and `basher link` symlinks the package (which breaks basher's
    find-based root-executable autodiscovery), so this stands in for
    `basher install` from the LOCAL tree: it materializes a real package dir from
    the checkout, runs basher's own `_link-bins`, and asserts that `compose.mk`
    (and ONLY compose.mk -- not the non-executable root Makefile) is linked and
    works (tool mode + global-mode CMK interpret).
skip_install = true
deps =
allowlist_externals = docker
commands =
    docker run --rm -e NO_COLOR=1 -v {tox_root}/..:/work:ro debian:bookworm-slim bash -c 'apt-get update -qq >/dev/null 2>&1 && apt-get install -y -qq git make jq gawk ca-certificates >/dev/null 2>&1 && git clone --depth=1 -q https://github.com/basherpm/basher.git $HOME/.basher && export PATH="$HOME/.basher/bin:$PATH" && eval "$(basher init - bash)" && pkg="$BASHER_PACKAGES_PATH/robot-wranglers/compose.mk" && mkdir -p "$pkg" && cp -p /work/compose.mk /work/Makefile "$pkg/" && basher _link-bins robot-wranglers/compose.mk && [ -e "$BASHER_PREFIX/bin/compose.mk" ] && [ ! -e "$BASHER_PREFIX/bin/Makefile" ] && compose.mk flux.ok && echo abc | compose.mk stream.echo | grep -qx abc && d=$(mktemp -d) && printf "a:\n\tprintf one\n__main__:\n\tthis.a\n" > "$d/x.cmk" && cd "$d" && CMK_SUPERVISOR=1 compose.mk mk.interpret! x.cmk | grep -q one'

[testenv:pip-installer]
description = 
    Build+install with the pip packaging shim; verify a global on-PATH
    `compose.mk` works (tool mode + global-mode CMK interpret). Exercises
    pip install "...#subdirectory=via/pip" (here via the local subdir).
skip_install = true
deps =
allowlist_externals = bash
commands =
    pip install --force-reinstall {tox_root}/../via/pip
    bash -c 'compose.mk flux.ok'
    bash -c 'echo abc | compose.mk stream.echo | grep -qx abc'
    bash -c 'd=$(mktemp -d); printf "a:\n\tprintf one\n__main__:\n\tthis.a\n" > "$d/x.cmk"; cd "$d"; CMK_SUPERVISOR=1 compose.mk mk.interpret! x.cmk | grep -q one'


