# Chapters (top-level `nav` sections) whose sidebar sub-tree starts OPEN
# regardless of the active page.  Currently EMPTY: every chapter starts COLLAPSED
# and the chapter holding the active page auto-expands just-in-time (so landing on
# the home/Overview page opens its own chapter, exactly like any other).  A parallel key to
# `nav` above, which stays untouched -- the sidebar template (docs/theme/base.html)
# reads this to set the initial `collapsed` class, and a triangle toggle on each
# chapter caption expands/collapses it live (theme_extra.js).  Values are chapter
# titles exactly as written under `nav`.  MkDocs logs a benign "Unrecognised
# configuration name" warning for this key; the (non-strict) build is unaffected
# and the value is still exposed to templates as `config.nav_expanded`.
nav_expanded: []
#https://github.com/mkdocs/mkdocs-redirects
plugins:
  # - search
  - autolinks
  - redirects:
      redirect_maps:
        index.md: 'overview.md'
        tui.md: 'embedded-tui.md'
        # NB: no `cmk.md` redirect -- under use_directory_urls it would build to
        # cmk/index.html, colliding with (and shadowing) the real cmk/index.md
        # Overview page.  Old /cmk/ links now land on the Overview index directly.
        cmk-lang.md: 'cmk/compiler.md'
        # back-compat: pages relocated under /cmk/ (2.0 docs reorg)
        compiler.md: 'cmk/compiler.md'
        language.md: 'cmk/paradigm.md'
        cmk-demos.md: 'cmk/demos.md'
        cmk-quick-ref.md: 'cmk/quickref.md'
        json.md: 'standard-lib.md#structured-io'
        structured-io.md: 'standard-lib.md#structured-io'
        plugins/golang.md: 'plugins/code.golang.md'
        plugins/polyglot.golang.md: 'plugins/code.golang.md'
        demos/ansible.md: 'demos/custom-automation-apis.md'
        demos/nushell.md: 'standard-lib.md#nushell'
        demos/event-loop.md: 'demos/flow-control.md'
# https://squidfunk.github.io/mkdocs-material/reference/lists/#using-definition-lists
markdown_extensions:
  - footnotes
  - admonition
  - pymdownx.details
  # Prism (client-side) is the SOLE highlighter.  use_pygments:false makes
  # superfences emit raw `<pre class="highlight"><code class="language-<x>">`
  # blocks (no server-side Pygments token spans) for Prism to highlight.
  - pymdownx.highlight:
      use_pygments: false
  - pymdownx.superfences
  - abbr
  - def_list
  - attr_list
docs_dir: docs
site_dir: site
  
