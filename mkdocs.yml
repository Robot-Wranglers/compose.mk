# https://python-markdown.github.io/extensions/admonition/
site_source_url: https://github.com/robot-wranglers/compose.mk
site_name: compose.mk
# repo_url: https://github.com/robot-wranglers/compose.mk
# repo_name: robot-wranglers/compose.mk
theme:
  name: readthedocs
  features:
    - content.code.annotate
    - content.code.copy
    # - navigation.sections
    - navigation.expand
    # - navigation.path
    # - navigation.prune
    # - navigation.tracking
    - navigation.top
    - toc.integrate
  font:
    # code: Roboto Mono
    code: Rasa
  logo: img/icon.png
  custom_dir: docs/theme
  # Highlighting is Prism-only (client-side; wired in docs/theme/base.html +
  # js/theme_base.js + js/theme_extra.js).  Pygments is disabled below via
  # `pymdownx.highlight: use_pygments:false`, and highlight.js is off here (its
  # <script> in base.html was already commented out -- only a dead CSS <link>
  # remained, which `highlightjs:false` now drops too).
  highlightjs: false
  # color_mode: dark
  # user_color_mode_toggle: yes
  icon:
    repo: fontawesome/brands/git-alt
  # icon:
  #   admonition:
  #     note: material/arrow-expand-down
# extra_css: ["extra.css"]
site_url: https://robot-wranglers.github.io/compose.mk
